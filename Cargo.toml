[package]
name = "m365-assess"
version = "1.1.0"
edition = "2021"
authors = ["Justin Middler"]
description = "Microsoft 365 Security Assessment CLI - Rust port of M365-Assess"
license = "MIT"
repository = "https://github.com/jusso-dev/M365-Secure"
readme = "README.md"

[[bin]]
name = "m365-assess"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# OAuth2
oauth2 = "4"

# macOS Keychain
security-framework = "3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# CSV
csv = "1"

# URL
url = "2"

# Base64
base64 = "0.22"

# Template engine for HTML reports
tera = "1"

# DNS resolver (for SPF/DKIM/DMARC checks)
trust-dns-resolver = "0.23"

# Progress indicators
indicatif = "0.17"
console = "0.15"

# Colored terminal output
colored = "2"

# Directory handling
dirs = "6"

# Futures for concurrent execution
futures = "0.3"

# Rate limiting
governor = "0.8"

# Retry logic
backon = "1"

# Async trait
async-trait = "0.1"

# Regex
regex = "1"

# XLSX output
xlsxwriter = "0.6"

# Junction: Microsoft API operation catalogue + read-only execution runtime (ARM, Resource Graph,
# Defender for Cloud, Sentinel, Defender for Endpoint). Pinned to a commit; bump deliberately.
junction-core = { git = "https://github.com/jusso-dev/junction", rev = "25dce87" }
junction-registry = { git = "https://github.com/jusso-dev/junction", rev = "25dce87" }
junction-runtime = { git = "https://github.com/jusso-dev/junction", rev = "25dce87" }
junction-auth = { git = "https://github.com/jusso-dev/junction", rev = "25dce87" }
junction-policy = { git = "https://github.com/jusso-dev/junction", rev = "25dce87" }
junction-http = { git = "https://github.com/jusso-dev/junction", rev = "25dce87" }

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
